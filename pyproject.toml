[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wop-sdk"
version = "0.1.0"
description = "WOP 商户侧官方 Python SDK：协议核心（签名/摘要/数字信封/验签解密）+ 可插拔 HTTP 适配层"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wop-platform" }]
requires-python = ">=3.9"
keywords = ["wop", "gateway", "sm2", "sm4-gcm", "rsa", "digital-envelope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
# 白名单（任务书 E5）：cryptography + gmssl；除此之外零运行时依赖
dependencies = [
    "cryptography>=41",
    "gmssl>=3.2.2",
]

[project.optional-dependencies]
# peer 适配器（不污染核心依赖面）
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]

[dependency-groups]
# 发布构建前端（PEP 735，不进发布元数据）：
# pip install --group dev && python -m build
dev = ["build"]

[project.urls]
Homepage = "https://github.com/wop-platform/wop-python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["wop_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
