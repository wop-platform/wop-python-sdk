[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wop-python-sdk"
version = "0.2.1"
description = "WOP 商户侧官方 Python SDK：协议核心（签名/摘要/数字信封/验签解密）+ 可插拔 HTTP 适配层"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wop-platform" }]
requires-python = ">=3.9"
keywords = ["wop", "gateway", "sm2", "sm4-gcm", "rsa", "digital-envelope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
# 白名单（任务书 E5）：cryptography + gmssl；除此之外零运行时依赖
dependencies = [
    "cryptography>=41",
    "gmssl>=3.2.2",
]

[project.optional-dependencies]
# peer 适配器（不污染核心依赖面）
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]

[dependency-groups]
# 发布构建前端 + BDD 测试工具链（PEP 735，不进发布元数据）：
# pip install --group dev && python -m build
# griffe：公共 API 快照门禁工具，版本锁定保证快照字节确定性
# （scripts/check-api-snapshot.py 与 ci.yml api-snapshot job）
 dev = ["build", "pytest-bdd>=8.0,<9.0", "griffe==1.14.0"]

[project.urls]
Homepage = "https://github.com/wop-platform/wop-python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

# 配置发现兜底来源（K6 优先级 6）：打包资源随包分发，setuptools 默认不收 JSON
[tool.setuptools.package-data]
"wop_sdk.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["wop_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py39"
line-length = 120
# .factory：从上游同步的 vendored 工厂副本，不在本仓维护，排除以免同步覆盖与噪声
extend-exclude = [".factory"]

[tool.ruff.lint]
# E4/E7/E9/F：语法/未定义名/未用导入变量/重定义等真实错误。
# E741/E702/E731 是历史代码纯风格（歧义单字母名、分号多语句、lambda 赋值——后者
# 是模块级公共 API `request_id_generator`，改为 def 会动 griffe API 快照），基线忽略。
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E702", "E731"]
