name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pytest 属测试工具链而非运行时依赖，CI 显式安装；
          # coverage[toml]：py<3.11 需 tomli 才能读 pyproject.toml 的 coverage 配置
          pip install -e '.[httpx]' pytest pytest-cov 'coverage[toml]'
      - name: Test with coverage gate (line+branch ≥ 98%, vector conformance must pass)
        run: python -m pytest --cov=wop_sdk --cov-branch --cov-fail-under=98
      - name: Coverage detail (line & branch)
        run: python -m coverage report --show-missing
