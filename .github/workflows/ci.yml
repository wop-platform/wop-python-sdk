name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC：无推送时也探测依赖上游新版（cryptography/gmssl/httpx breaking change 早发现）
    - cron: "0 3 * * 1"
  workflow_dispatch:

# 最低权限基线：GITHUB_TOKEN 默认权限收窄为只读。
# test/oldest-deps 仅需 checkout（contents: read）；
# notify-failure/notify-recovery 作业级 permissions 整体覆盖此基线，不受影响。
permissions:
  contents: read

jobs:
  test:
    # 轴 1：Python 解释器矩阵（3.9 = 声明下界（spec §3 契约）；3.14 = 当前最新稳定），依赖取最新
    # 轴 2：OS 矩阵（ubuntu x86_64 + macOS arm64）——cryptography/gmssl 走各平台轮子，
    # 双 OS 钉住平台相关行为漂移（interop 消费与 OS 矩阵同基线，跨仓拉齐要求）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pytest/pytest-bdd 属测试工具链而非运行时依赖，CI 显式安装；
          # coverage[toml]：py<3.11 需 tomli 才能读 pyproject.toml 的 coverage 配置
          pip install -e '.[httpx,requests]' pytest pytest-bdd pytest-cov 'coverage[toml]'
      - name: Test with coverage gate (line+branch ≥ 98%, vector conformance must pass)
        run: python -m pytest --cov=wop_sdk --cov-branch --cov-fail-under=98
      - name: Coverage detail (line & branch)
        run: python -m coverage report --show-missing

  oldest-deps:
    # 轴 2：依赖下界作业——pyproject 声明的每一个 >= 下界，都要有作业实际装下界跑全量
    # （“声明即 tested”）。--no-deps 防 pip 把 pin 抬回最新造成假绿。
    # cryptography/gmssl 被全部 214 个用例真实执行（协议核心走真库）；
    # httpx/requests 适配器测试走 fake 模块注入，此处 pin 验证 extras 可解析安装。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned lower bounds
        run: |
          python -m pip install --upgrade pip
          pip install cryptography==41.0.0 gmssl==3.2.2 httpx==0.24.0 requests==2.28.0
          pip install -e . --no-deps
          pip install pytest pytest-bdd pytest-cov 'coverage[toml]'
      - name: Test with coverage gate at dependency lower bounds
        run: python -m pytest --cov=wop_sdk --cov-branch --cov-fail-under=98

  notify-failure:
    # 失败自动开单：不依赖个人通知设置的持久失败痕迹（单一跟踪 issue，幂等追加）
    needs: [test, oldest-deps]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read   # gh run view 取失败 job 名单
      issues: write
    steps:
      - name: Create or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          TITLE="CI 失败跟踪（自动开单）"
          FAILED=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion=="failure") | .name' | sed 's/^/  - /')
          BODY=$(printf '## CI 失败\n- 触发：%s\n- commit：[%s](https://github.com/%s/commit/%s)\n- run：%s\n- 失败 job：\n%s\n\n此 issue 由 CI 自动创建/追加；工作流恢复绿后将自动关闭。' \
            "$EVENT" "$SHA" "$GITHUB_REPOSITORY" "$SHA" "$RUN_URL" "$FAILED")
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "CI 失败跟踪 in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

  notify-recovery:
    # 恢复自动关单：闭环（失败开 → 绿后关）
    needs: [test, oldest-deps]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close tracking issue if any
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUMBER=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "CI 失败跟踪 in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" --comment "CI 已恢复绿：$RUN_URL"
          fi
