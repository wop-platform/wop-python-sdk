name: sourcery-review-gate

# 合并门禁：sourcery review 存在未解决 issue 时禁止合并（"评论清零"契约的自动化形态）。
# - 规则保留清单在 .sourcery.yaml（评审确认的 disable 项），本 job 与 sourcery-ai[bot] 同配置
# - 只扫 PR 变更文件；有 issue → exit 1 → 合并保护拦截；修复后 push 自动重跑，绿 = 可合并
# - 清零判定不用评论状态：GitHub 会把已修复评论的 thread 自动重新锚定（position 恒非 null，
#   commit_id 甚至跟随到新 head），无法区分已修复/未修复；CLI --check 与 bot 同引擎同配置，
#   输出即当前 head 的真值。pull_request_review_comment 事件：sourcery 评论/回复到达时立即重估。
# - fork PR 无 secrets：跳过门禁（外部贡献走维护者复核）；workflow_dispatch：base 用默认分支。
# 前提：仓库需配置 SOURCERY_TOKEN secret（sourcery.ai 账号 token），否则本 job 显式失败。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Sourcery CLI
        run: python -m pip install --quiet sourcery
      - name: Sourcery gate — issues must be cleared before merge
        env:
          SOURCERY_TOKEN: ${{ secrets.SOURCERY_TOKEN }}
        run: |
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "fork PR：无 SOURCERY_TOKEN 可用，gate 跳过（外部贡献走维护者复核）。"
            exit 0
          fi
          if [ -z "$SOURCERY_TOKEN" ]; then
            echo "::error::SOURCERY_TOKEN secret 未配置：仓库 Settings → Secrets and variables → Actions 添加 sourcery.ai 账号 token，否则本门禁无法运行。"
            exit 1
          fi
          BASE="${{ github.event.pull_request.base.ref }}"
          [ -z "$BASE" ] && BASE="${{ github.event.repository.default_branch }}"
          git fetch origin "$BASE" --quiet
          FILES=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -E '\.(py|go|java|cs|php|ts|js)$' || true)
          if [ -z "$FILES" ]; then
            echo "无语言文件变更，gate 通过。"
            exit 0
          fi
          sourcery review --check $FILES
