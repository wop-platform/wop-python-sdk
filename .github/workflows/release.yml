name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    # 环境值按分发名（wop-python-sdk）：PYPI_TOKEN 配置于该 GitHub Environment
    # （或仓库级 Secrets，环境引用不影响仓库级回退）
    environment: wop-python-sdk
    permissions:
      # write 仅用于创建 GitHub Release 条目；PyPI 发布走 PYPI_TOKEN，不占 token 权限
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 与 ci.yml 保持一致：pytest 属测试工具链而非运行时依赖，CI 显式安装；
          # coverage[toml]：py<3.11 需 tomli 才能读 pyproject.toml 的 coverage 配置
          pip install -e '.[httpx]' pytest pytest-cov 'coverage[toml]'
      - name: Test with coverage gate (line+branch ≥ 98%, must pass before publish)
        run: python -m pytest --cov=wop_sdk --cov-branch --cov-fail-under=98
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        # 发布步骤位于测试全绿之后，失败不留半发布状态
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Create GitHub Release
        # 仅在 PyPI 发布成功后执行（前置步骤失败即跳过）——Release 条目 = 已发布信号；
        # 幂等：已存在（workflow 重跑）则跳过；说明用 --generate-notes 基线，发布后可随时人工编辑
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
                 --title "wop-python-sdk ${VERSION}" --generate-notes
